name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: fmt / lint / check / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.4.2

      - name: Install dependencies (lockfile must be up to date)
        run: deno install --frozen

      - run: deno task fmt:check
      - run: deno task lint
      - run: deno task check
      - run: deno task test

  deploy:
    name: Deploy to Fly.io
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # Only one deploy at a time; a second push waits rather than racing the rolling restart.
    concurrency:
      group: fly-deploy
      cancel-in-progress: false
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip when FLY_API_TOKEN is not configured
        if: env.FLY_API_TOKEN == ''
        run: echo "FLY_API_TOKEN secret not set; skipping deploy." >> "$GITHUB_STEP_SUMMARY"

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: env.FLY_API_TOKEN != ''

      - name: fly deploy
        if: env.FLY_API_TOKEN != ''
        run: flyctl deploy --remote-only
